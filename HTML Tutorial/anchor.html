<!DOCTYPE html>
<head>
    <title>Anchor Tags</title>
</head>
<body>
    <h1>Anchor Tags in HTML</h1>
    <h4>Anchor tags are used to create hyperlinks in HTML. They allow users to navigate from one page to another or to different sections within the same page.</h4>
    <br>
    <ul>
        <li><a href="https://www.chipitechnologies.com" target="_blank">Visit Chipi Technologies</a></li>
        <li><a href="https://www.google.com" target="_blank">Visit Google</a></li>
        <li><a href="https://www.facebook.com" target="_blank">Visit Facebook</a></li>
    </ul>

    <ul><li><a href="./index.html">Visit Home Page</a></li></ul>

</body>
</html>
